server:
  port: 8080

spring:
  application:
    name: ai-coding-agent
  # NOTE: these datasource properties describe the MySQL setup this app prefers.
  # DatabaseFallbackConfigurer (run from main() before Spring Boot starts) checks
  # whether MySQL is actually reachable and, if not, overrides these at runtime to
  # point at a local H2 file database instead - see its javadoc, or README.md's
  # "Running without MySQL" section. Set DB_AUTO_FALLBACK_H2=false to disable that
  # and fail fast on an unreachable MySQL instead.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_coding_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:D!l!p1475}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5-coder:32b}
  #model: ${OLLAMA_MODEL:llama3.2}
  connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:5}
  request-timeout-seconds: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:60}
  max-retries: 2

agent:
  allowed-repository-base-dir: ${AGENT_ALLOWED_BASE_DIR:}
  max-tool-iterations: 8
  command-timeout-seconds: 60
  max-message-length: 8000
  max-tool-output-length: 20000
  approved-commands:
    - "mvn test"
    - "mvn -q compile"
    - "mvn compile"
    - "mvn package"
    - "npm test"
    - "npm run build"
    - "npm run lint"
    - "npm install"
    - "git status"
    - "git diff"
    - "git log"

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

logging:
  level:
    com.codecafe.aicodingagent: INFO
